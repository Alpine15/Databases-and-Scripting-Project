<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cycling Event Database</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 35px auto;
            padding: 0 18px;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            color: #555;
        }

        section {
            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 16px;
            margin: 16px 0;
        }

        h2 {
            font-size: 19px;
            margin-top: 0;
        }

        input,
        button {
            font: inherit;
            padding: 8px;
            margin: 4px 4px 4px 0;
        }

        input {
            max-width: 170px;
        }

        button {
            background: #245b46;
            color: white;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #184332;
        }

        #results {
            overflow-x: auto;
            background: #f6f8f7;
            padding: 12px;
            border-radius: 6px;
            min-height: 50px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #e5ede8;
        }

        .error {
            color: #a52323;
        }
    </style>
</head>

<body>
    <h1>Cycling Event Database</h1>
    <p>Search riders, manage records, and view race information.</p>

    <!-- 1. Search Riders -->
    <section>
        <h2>1. Search Riders</h2>
        <form id="searchForm">
            <input id="searchName" placeholder="Rider name (optional)">
            <button type="submit">Search</button>
        </form>
    </section>

    <!-- 2. View Team Riders -->
    <section>
        <h2>2. View Team Riders</h2>
        <form id="teamForm">
            <input id="teamId" type="number" min="1" required placeholder="Team ID">
            <button type="submit">View Team</button>
        </form>
    </section>

    <!-- 3. Add Rider -->
    <section>
        <h2>3. Add Rider</h2>
        <form id="addForm">
            <input id="addName" required placeholder="Rider name">
            <input id="addTeam" type="number" min="1" required placeholder="Team ID">
            <input id="addAge" type="number" min="0" max="120" placeholder="Age (optional)">
            <button type="submit">Add Rider</button>
        </form>
    </section>

    <!-- 4. Update Rider -->
    <section>
        <h2>4. Update Rider Age</h2>
        <form id="updateForm">
            <input id="updateId" type="number" min="1" required placeholder="Rider ID">
            <input id="updateAge" type="number" min="0" max="120" required placeholder="New age">
            <button type="submit">Update Age</button>
        </form>
    </section>

    <!-- 5. Team Summary -->
    <section>
        <h2>5. Team Summary</h2>
        <button id="summaryButton" type="button">
            Show Riders per Team
        </button>
    </section>

    <!-- 6. Race Results -->
    <section>
        <h2>6. Race Results</h2>
        <form id="raceForm">
            <input id="raceId" type="number" min="1" required placeholder="Race ID">
            <button type="submit">Show Results</button>
        </form>
    </section>

    <!-- 7. All Events -->
    <section>
        <h2>7. View All Events</h2>
        <button id="eventsButton" type="button">
            Show All Events
        </button>
    </section>

    <!-- 8. Event Vendors -->
    <section>
        <h2>8. Event Vendors</h2>
        <form id="vendorsForm">
            <input id="vendorsEventId" type="number" min="1" required placeholder="Event ID">
            <button type="submit">Show Vendors</button>
        </form>
    </section>

    <!-- 9. Event Teams -->
    <section>
        <h2>9. Event Teams</h2>
        <form id="eventTeamsForm">
            <input id="teamsEventId" type="number" min="1" required placeholder="Event ID">
            <button type="submit">Show Teams</button>
        </form>
    </section>

    <h2>Results</h2>
    <div id="results">Choose an operation above.</div>

    <script>
        const results = document.getElementById('results');

        // Display results as a table or message
        function showResults(data) {
            results.replaceChildren();

            if (!Array.isArray(data)) {
                const message = document.createElement('p');
                message.textContent =
                    data.message || data.error || 'Operation completed.';

                if (data.error) message.className = 'error';
                results.appendChild(message);

                if (data.rider_id) {
                    const id = document.createElement('p');
                    id.textContent = 'New rider ID: ' + data.rider_id;
                    results.appendChild(id);
                }
                return;
            }

            if (data.length === 0) {
                results.textContent = 'No records found.';
                return;
            }

            const table = document.createElement('table');
            const header = document.createElement('tr');

            Object.keys(data[0]).forEach(key => {
                const th = document.createElement('th');
                th.textContent = key.replaceAll('_', ' ');
                header.appendChild(th);
            });

            table.appendChild(header);

            data.forEach(row => {
                const tr = document.createElement('tr');

                Object.values(row).forEach(value => {
                    const td = document.createElement('td');
                    td.textContent = value == null ? '—' : String(value);
                    tr.appendChild(td);
                });

                table.appendChild(tr);
            });

            results.appendChild(table);
        }

        // Send requests to the server
        async function request(url, options) {
            results.textContent = 'Loading...';

            try {
                const response = await fetch(url, options);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Request failed');
                }

                showResults(data);
            } catch (err) {
                showResults({ error: err.message });
            }
        }

        // Search riders
        document.getElementById('searchForm').addEventListener('submit', event => {
            event.preventDefault();

            const name = document.getElementById('searchName').value;
            request('/riders?name=' + encodeURIComponent(name));
        });

        // View team riders
        document.getElementById('teamForm').addEventListener('submit', event => {
            event.preventDefault();

            const id = document.getElementById('teamId').value;
            request('/teams/' + id + '/riders');
        });

        // Add rider
        document.getElementById('addForm').addEventListener('submit', event => {
            event.preventDefault();

            const age = document.getElementById('addAge').value;

            request('/riders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('addName').value,
                    team_id: Number(document.getElementById('addTeam').value),
                    age: age === '' ? null : Number(age)
                })
            });
        });

        // Update rider age
        document.getElementById('updateForm').addEventListener('submit', event => {
            event.preventDefault();

            const id = document.getElementById('updateId').value;
            const age = document.getElementById('updateAge').value;

            request('/riders/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ age: Number(age) })
            });
        });

        // Team summary
        document.getElementById('summaryButton').addEventListener('click', () => {
            request('/reports/teams');
        });

        // Race results
        document.getElementById('raceForm').addEventListener('submit', event => {
            event.preventDefault();

            const id = document.getElementById('raceId').value;
            request('/races/' + id + '/results');
        });

        // Show all events
        document.getElementById('eventsButton').addEventListener('click', () => {
            request('/events');
        });

        // Show vendors at an event
        document.getElementById('vendorsForm').addEventListener('submit', event => {
            event.preventDefault();

            const id = document.getElementById('vendorsEventId').value;
            request('/events/' + id + '/vendors');
        });

        // Show teams at an event
        document.getElementById('eventTeamsForm').addEventListener('submit', event => {
            event.preventDefault();

            const id = document.getElementById('teamsEventId').value;
            request('/events/' + id + '/teams');
        });
    </script>
</body>

</html>
